   </g>
   <g id="text_2">
    <text style="fill: #8f8f8f; font: italic 7px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: start" x="9.72" y="29.757641" transform="rotate(-0 9.72 29.757641)">Five independent lines of evidence converge on the same conclusion.</text>
   </g>
   <g id="text_3">
    <text style="fill: #272727; font: 700 8px 'Arial'; text-anchor: start" x="17.28" y="55.92975" transform="rotate(-0 17.28 55.92975)">L1</text>
   </g>
   <g id="text_4">
    <text style="fill: #272727; font: 700 8px 'Arial'; text-anchor: start" x="62.64" y="55.87725" transform="rotate(-0 62.64 55.87725)">Phenomenological</text>
   </g>
   <g id="text_5">
    <text style="fill: #4d4d4d; font: 7px 'Arial'; text-anchor: start" x="168.48" y="55.66725" transform="rotate(-0 168.48 55.66725)">Unclumped +0.10 → null after LD-clumping</text>
   </g>
   <g id="text_6">
    <text style="fill: #b64342; font: 700 7px 'Arial'; text-anchor: start" x="455.76" y="55.66725" transform="rotate(-0 455.76 55.66725)">Gatekeeper triggered</text>
   </g>
   <g id="text_7">
    <text style="fill: #272727; font: 700 8px 'Arial'; text-anchor: start" x="17.28" y="88.32975" transform="rotate(-0 17.28 88.32975)">L2</text>
   </g>
   <g id="text_8">
    <text style="fill: #272727; font: 700 8px 'Arial'; text-anchor: start" x="62.64" y="88.32975" transform="rotate(-0 62.64 88.32975)">Genome-wide</text>
   </g>
   <g id="text_9">
    <text style="fill: #4d4d4d; font: 7px 'Arial'; text-anchor: start" x="168.48" y="88.06725" transform="rotate(-0 168.48 88.06725)">r_g = -0.03 (P=0.57); unchanged after chr19 removal</text>
   </g>
   <g id="text_10">
    <text style="fill: #8f8f8f; font: 700 7px 'Arial'; text-anchor: start" x="455.76" y="88.024594" transform="rotate(-0 455.76 88.024594)">No genome-wide arch</text>
   </g>
   <g id="text_11">
    <text style="fill: #272727; font: 700 8px 'Arial'; text-anchor: start" x="17.28" y="120.72975" transform="rotate(-0 17.28 120.72975)">L3</text>
   </g>
   <g id="text_12">
    <text style="fill: #272727; font: 700 8px 'Arial'; text-anchor: start" x="62.64" y="120.72975" transform="rotate(-0 62.64 120.72975)">Locus-level</text>
   </g>
   <g id="text_13">
    <text style="fill: #4d4d4d; font: 7px 'Arial'; text-anchor: start" x="168.48" y="120.46725" transform="rotate(-0 168.48 120.46725)">Reverse colocalisation strong (18/32); forward weak (1/47)</text>
   </g>
   <g id="text_14">
    <text style="fill: #8f8f8f; font: 700 7px 'Arial'; text-anchor: start" x="455.76" y="120.46725" transform="rotate(-0 455.76 120.46725)">Shared liability, not directed</text>
   </g>
   <g id="text_15">
    <text style="fill: #272727; font: 700 8px 'Arial'; text-anchor: start" x="17.28" y="153.12975" transform="rotate(-0 17.28 153.12975)">L4</text>
   </g>
   <g id="text_16">
    <text style="fill: #272727; font: 700 8px 'Arial'; text-anchor: start" x="62.64" y="153.12975" transform="rotate(-0 62.64 153.12975)">Mechanistic</text>
   </g>
   <g id="text_17">
    <text style="fill: #4d4d4d; font: 7px 'Arial'; text-anchor: start" x="168.48" y="152.86725" transform="rotate(-0 168.48 152.86725)">TG partly mediates education→AD; CRP/IL-6 null (FDR &gt; 0.9)</text>
   </g>
   <g id="text_18">
    <text style="fill: #8f8f8f; font: 700 7px 'Arial'; text-anchor: start" x="455.76" y="152.913187" transform="rotate(-0 455.76 152.913187)">Lipid, not inflammation</text>
   </g>
   <g id="text_19">
    <text style="fill: #272727; font: 700 8px 'Arial'; text-anchor: start" x="17.28" y="185.52975" transform="rotate(-0 17.28 185.52975)">L5</text>
   </g>
   <g id="text_20">
    <text style="fill: #272727; font: 700 8px 'Arial'; text-anchor: start" x="62.64" y="185.52975" transform="rotate(-0 62.64 185.52975)">Protective factor</text>
   </g>
   <g id="text_21">
    <text style="fill: #4d4d4d; font: 7px 'Arial'; text-anchor: start" x="168.48" y="185.26725" transform="rotate(-0 168.48 185.26725)">Education protects AD and PD (PheWAS); EAS consistent</text>
   </g>
   <g id="text_22">
    <text style="fill: #2e7d5b; font: 700 7px 'Arial'; text-anchor: start" x="455.76" y="185.270531" transform="rotate(-0 455.76 185.270531)">Independent protective axis</text>
   </g>
   <g id="text_23">
    <text style="fill: #ffffff; font: 700 8px 'Arial'; text-anchor: start" x="19.8" y="230.88975" transform="rotate(-0 19.8 230.88975)">SYNTHESIS</text>
   </g>
   <g id="text_24">
    <text style="fill: #ffffff; font: 7.5px 'Arial'; text-anchor: start" x="19.8" y="243.718969" transform="rotate(-0 19.8 243.718969)">Insomnia–AD comorbidity  =  shared APOE-locus liability, with no independent causal upstream of AD.</text>
   </g>
   <g id="text_25">
    <text style="fill: #a8b6cc; font: italic 7px 'Arial'; text-anchor: end" x="501.12" y="237.105609" transform="rotate(-0 501.12 237.105609)">Quadrant III</text>
   </g>
